<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanz-Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one column of cards in reading order (Vermögen → Lohn → Monat → Abgleich → Erspartes → Analyse), dark violet like the approved draft */
:root{
  --bg:#0D0A16; --card:#17122A; --card2:#1E1834; --line:#2A2240; --line2:#221B38; --track:#241D3A; --on:#241C42;
  --fg:#EDE9FE; --fg-strong:#FFFFFF; --muted:#A49DC0; --faint:#8A83A6;
  --accent:#8B5CF6; --accent-soft:#C4B5FD; --lav:#C084FC; --cyan:#22D3EE; --pink:#F472B6; --amber:#FBBF24;
  --good:#6EE7B7; --good-bg:#10291F; --warn:#FDBA74; --warn-bg:#3A2312; --bad:#F87171; --bad-bg:#3A1414;
  --korr:#7DD3FC; --korr-bg:#0F2433; --chip:#2E2552; --chip-fg:#DDD6FE;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Space Grotesk",Inter,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);font-weight:700;color:var(--fg-strong)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.loadbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px dashed var(--line);border-radius:14px;background:var(--card)}
.loadbar.drag{border-color:var(--accent);background:var(--on)}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 16px;font:600 14px var(--f-body);cursor:pointer;background:var(--accent);color:#fff;min-height:40px}
.btn.ghost{background:transparent;color:var(--accent-soft);border:1px solid var(--line)}
.btn:focus-visible,.rb:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card.warnb{border-color:#5B3A1A} .card.badb{border-color:#4A1D1D}
.ctitle{font-size:16px;font-weight:600;color:var(--fg-strong)}
.csub{font-size:12px;color:var(--muted)}
.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--fg-strong)}
.sec{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--fg-strong);margin-top:8px}
.sec small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--faint)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:start}
.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s12{grid-column:span 12}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{padding:16px 18px;border-radius:16px;background:var(--card2);display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--c,var(--accent))}
.tile .t{font-size:13px;color:var(--muted);font-weight:500}.tile .v{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--fg-strong)}.tile .n{font-size:12px;font-weight:600;color:var(--c,var(--accent))}
.totbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-radius:14px;background:var(--on);font-size:15px;font-weight:700;color:var(--fg-strong)}
.scroll{overflow-x:auto}
.tbl{display:flex;flex-direction:column;min-width:var(--mw,520px)}
.tr{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--line2);font-size:14px}
.th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);padding-top:0}
.tt{font-weight:700;color:var(--fg-strong);border-bottom:0;padding-top:12px}
.tsub{font-size:13px;color:var(--muted);border-bottom:0;padding-top:4px}
.r{text-align:right}.c{text-align:center}.b{font-weight:600;color:var(--fg-strong)}
.rb{all:unset;box-sizing:border-box;width:100%;cursor:pointer;border-radius:8px;font-family:var(--f-body)}
.rb.tr{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--line2);font-size:14px;color:var(--fg)}
.rb:hover{background:#221B3B}
.rb.on{background:var(--on)}
.bar{position:relative;flex:1 1 0;height:8px;border-radius:999px;background:var(--track)}
.bar>i{display:block;height:8px;border-radius:999px;background:var(--accent)}
.bar>u{position:absolute;top:-4px;width:2px;height:16px;background:#fff;opacity:.6}
.barcell{display:flex;align-items:center;gap:8px}
.barcell .p{width:50px;text-align:right;font-size:12px;font-weight:600;color:var(--accent-soft)}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--chip-fg);font-size:12px;font-weight:500}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.tag.good{background:var(--good-bg);color:var(--good)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.neu{background:var(--track);color:var(--muted)}
.detail{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:16px;background:#120E20;border:1px solid #3B2F63}
.sub{margin:4px 0 12px;padding:16px;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;gap:12px}
.cols{columns:150px;column-gap:20px}
.cols>div{break-inside:avoid;display:flex;justify-content:space-between;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px}
.korr{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:var(--korr-bg);border:1px dashed #2B5A78;color:var(--korr)}
.rate{display:flex;justify-content:space-between;padding:10px 12px;border-radius:10px;background:var(--good-bg);color:var(--good);font-weight:600;font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.pos{color:var(--good)!important}.neg{color:var(--bad)!important}.wrn{color:var(--warn)!important}
.donutrow{display:grid;grid-template-columns:280px minmax(0,1fr) minmax(0,1.2fr);gap:32px;align-items:center}
.donut{width:250px;height:250px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto}
.donut>div{width:160px;height:160px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.check{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;background:var(--card2);border-radius:14px}
.check .ic{flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.trend{display:flex;align-items:flex-end;gap:8px;height:230px;border-bottom:1px solid var(--line)}
.trend>div{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;gap:6px}
.trend .lbl{font-size:10px;color:var(--muted);white-space:nowrap}
.trend .col{width:100%;border-radius:6px 6px 2px 2px}
.trend .bud{position:absolute;left:-3px;right:-3px;height:2px;background:#fff;opacity:.55}
.months{display:flex;gap:8px}.months>div{flex:1 1 0;min-width:0;text-align:center;font-size:12px;color:var(--muted)}
.empty{display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:28px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.empty ol{margin:0;padding-left:20px;color:var(--muted);line-height:1.7}
.err{padding:12px 14px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-weight:600}
@media (max-width:960px){.g2,.g12,.donutrow{grid-template-columns:minmax(0,1fr)}.s5,.s6,.s7,.s12{grid-column:auto}}
@media (prefers-reduced-motion:no-preference){.rb{transition:background .15s}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <header class="hdr">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div class="eyebrow">Finanz-Cockpit</div>
      <h1 class="disp" id="hMonth" style="font-size:40px">Noch keine Daten</h1>
      <div class="muted" id="hSub">Lade deine Excel-Datei „Finanzen_Cockpit.xlsx“.</div>
    </div>
    <div class="pills" id="hPills"></div>
  </header>

  <div class="loadbar" id="loadbar">
    <button class="btn" id="pick" type="button">Excel-Datei laden</button>
    <button class="btn ghost" id="reload" type="button" hidden>Neu laden</button>
    <input type="file" id="file" accept=".xlsx,.xlsm" hidden>
    <span class="muted" id="loadInfo">Oder die Datei hierher ziehen. Die Datei wird nur in deinem Browser gelesen und nirgends hochgeladen.</span>
    <button class="btn ghost" id="forget" type="button" hidden style="margin-left:auto">Daten auf diesem Gerät vergessen</button>
  </div>
  <div id="msg"></div>
  <main id="main" style="display:flex;flex-direction:column;gap:24px"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
const KEY='finanzcockpit:v1';
const st={data:null,sel:{b:null,bm:null,s:null,sm:null,v:null,j:null}};
const nf=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100+0;
const eur=n=>(n==null||!isFinite(n))?'–':nf.format(r2(n))+' €';
const sg=n=>(n==null||!isFinite(n))?'–':(n>0.004?'+':n<-0.004?'−':'')+nf.format(Math.abs(r2(n)))+' €';
const pct=(r,d)=>(r==null||!isFinite(r))?'–':(r*100).toLocaleString('de-DE',{minimumFractionDigits:d??1,maximumFractionDigits:d??1})+' %';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
const isNum=x=>typeof x==='number'&&isFinite(x);
const toDate=n=>new Date(Math.round((n-25569)*86400000));
const mkey=n=>{const d=toDate(n);return String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear();};
const dstr=n=>{const d=toDate(n);return String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0')+'.'+d.getUTCFullYear();};
const MONTHS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const PRIO={Pflicht:'#FDBA74',Wichtig:'#6EE7B7',Sinnig:'#93C5FD',Luxus:'#D8B4FE'};

/* ---------------- parsing ---------------- */
function splitTerms(f,v){
  const s=String(f).replace(/\s/g,'');
  if(/^[-+]?\d+(\.\d+)?([-+]\d+(\.\d+)?)*$/.test(s)){return (s.match(/[-+]?\d+(\.\d+)?/g)||[]).map(Number).filter(x=>x!==0);}
  return isNum(v)&&v!==0?[v]:[];
}
function parse(wb){
  const sh=n=>wb.Sheets[n];
  const E=sh('Eingabe'),D=sh('Dashboard'),V=sh('Verträge'),J=sh('Jahresverträge');
  if(!E||!D||!V||!J) throw new Error('In der Datei fehlen Blätter (Eingabe, Dashboard, Verträge, Jahresverträge). Ist das die Finanz-Cockpit-Mappe?');
  const cell=(ws,r,c)=>ws[XLSX.utils.encode_cell({r,c})];
  const v=(ws,r,c)=>{const x=cell(ws,r,c);return x?x.v:undefined;};
  const n=(ws,r,c)=>{const x=v(ws,r,c);return isNum(x)?x:0;};
  const names={};
  ((wb.Workbook&&wb.Workbook.Names)||[]).forEach(o=>{const m=/^'?([^'!]+)'?!\$?([A-Z]+)\$?(\d+)$/.exec(o.Ref||'');if(m&&sh(m[1])){const c=sh(m[1])[m[2]+m[3]];names[o.Name]=c?c.v:undefined;}});
  if(!isNum(names.AktMonat)) throw new Error('„Aktueller Monat“ wurde nicht gefunden oder hat keinen Wert. Bitte die Datei einmal in Excel öffnen und speichern.');
  if(!isNum(names.Vermoegen)) throw new Error('Die Datei enthält keine berechneten Werte. Bitte einmal in Excel öffnen, speichern und erneut laden.');
  const N=k=>isNum(names[k])?names[k]:0;
  const rgE=XLSX.utils.decode_range(E['!ref']);
  // ---- grid
  let LB=-1,LS=-1;
  for(let c=0;c<=rgE.e.c;c++){const x=v(E,3,c);if(x==='Budget')LB=c;if(x==='SparBudget')LS=c;}
  if(LB<0||LS<0) throw new Error('Auf dem Blatt „Eingabe“ wurden die Kopfzeilen der Budgets nicht gefunden.');
  const pots=lc=>{const o=[];for(let c=lc+1;c<=rgE.e.c;c++){const x=v(E,3,c);if(x==null||x==='')break;o.push({name:String(x),c});}return o;};
  const PB=pots(LB),PS=pots(LS);
  const labRow=(lc,lab)=>{for(let r=3;r<14;r++)if(v(E,r,lc)===lab)return r;return -1;};
  let kontoRow=-1;for(let r=8;r<60;r++){if(v(E,r,LB)==='Konto'){kontoRow=r;break;}}
  let katEnd=kontoRow+6;(E['!merges']||[]).forEach(m=>{if(m.s.c===LB&&m.s.r===kontoRow+1)katEnd=m.e.r;});
  const cats=c=>{const o=[];for(let r=kontoRow+1;r<=katEnd;r++){const x=v(E,r,c);if(x!=null&&x!=='')o.push(String(x));}return o;};
  const blocks=[];
  for(let r=katEnd+1;r<=rgE.e.r;r++){
    const h=v(E,r,LB);
    if(isNum(h)&&v(E,r+1,LB)==='Rate / Budget'){
      let sr=r+3;while(sr<=rgE.e.r&&v(E,sr,LB)!=='Summe Monat')sr++;
      const blk={key:mkey(h),serial:h,pots:{}};
      for(const p of PB.concat(PS)){
        const kc=cell(E,r+2,p.c);
        const korr=kc?(kc.f?splitTerms(kc.f,kc.v):(isNum(kc.v)&&kc.v!==0?[kc.v]:[])):[];
        const items=[];for(let rr=r+3;rr<sr;rr++){const x=v(E,rr,p.c);if(isNum(x)&&x!==0)items.push(x);}
        const stv=v(E,sr+1,p.c);
        blk.pots[p.name]={rate:r2(n(E,r+1,p.c)),korr,korrSum:r2(n(E,r+2,p.c)),items,sum:r2(n(E,sr,p.c)),stand:isNum(stv)?r2(stv):null};
      }
      blocks.push(blk);r=sr+1;
    }
  }
  const head=(lc,P,labels)=>P.map(p=>{const o={name:p.name,prio:String(v(E,labRow(lc,'Priorität'),p.c)||''),konto:String(v(E,kontoRow,p.c)||''),cats:cats(p.c)};labels.forEach(([k,l])=>{const x=n(E,labRow(lc,l),p.c);o[k]=k==='quote'?x:r2(x);});return o;});
  const budgets=head(LB,PB,[['budget','Budget / Monat'],['spent','Ausgegeben'],['rest','Übrig'],['quote','Verbraucht']]);
  const spar=head(LS,PS,[['rate','Rate / Monat'],['spent','Ausgegeben'],['stand','Stand'],['ziel','Ziel'],['fehlt','Fehlt']]);
  // ---- left tables on Eingabe (column B)
  const colB=lab=>{for(let r=0;r<=Math.min(rgE.e.r,200);r++)if(v(E,r,1)===lab)return r;return -1;};
  const tableB=(hdr,ncols)=>{const r0=colB(hdr);if(r0<0)return {rows:[],total:null};const rows=[];let total=null;for(let r=r0+1;r<r0+40;r++){const a=v(E,r,1);if(a==null||a==='')break;const row=[a];for(let c=2;c<1+ncols;c++)row.push(v(E,r,c));if(a==='Gesamt'){total=row;break;}rows.push(row);}return {rows,total};};
  const konten=tableB('Konto',2),depots=tableB('Posten',5),etf=tableB('ETF',5);
  const bspR=colB('Bausparvertrag – Aufstellung');const bauspar=[];if(bspR>=0)for(let r=bspR+1;r<bspR+5;r++)bauspar.push([v(E,r,1),n(E,r,2)]);
  // ---- Dashboard sections
  const rgD=XLSX.utils.decode_range(D['!ref']);const secs=[];let cur=null;
  for(let r=0;r<=rgD.e.r;r++){const a=v(D,r,1);if(a==null||a==='')continue;if(typeof a==='string'&&/^\d+ · /.test(a)){cur={title:a,rows:[]};secs.push(cur);continue;}if(cur)cur.rows.push([a,v(D,r,2),v(D,r,3),v(D,r,4),v(D,r,5),v(D,r,6)]);}
  const sec=i=>secs.find(s=>s.title.startsWith(i+' ·'))||{rows:[]};
  const after=(s,hdr,occ)=>{let k=0;const o=[];let on=false,total=null;for(const row of s.rows){if(!on){if(row[0]===hdr){if((k++)===(occ||0))on=true;}continue;}if(String(row[0]).startsWith('Gesamt')){total=row;break;}o.push(row);}return {rows:o,total};};
  const findRow=(s,lab)=>s.rows.find(x=>x[0]===lab);
  const s1=sec(1),s2=sec(2),s4=sec(4),s5=sec(5),s7=sec(7);
  // ---- Verträge / Jahresverträge
  const readTable=(ws)=>{const rg=XLSX.utils.decode_range(ws['!ref']);const hdr={};for(let c=1;c<=rg.e.c;c++){const x=v(ws,4,c);if(x)hdr[String(x)]=c;}const rows=[];for(let r=5;r<=rg.e.r;r++){const a=v(ws,r,1);if(a==null||a===''||a==='Gesamt')break;const o={};for(const k in hdr)o[k]=v(ws,r,hdr[k]);rows.push(o);}return rows;};
  return {
    loaded:Date.now(),
    akt:mkey(N('AktMonat')),aktSerial:N('AktMonat'),stand:isNum(names.LetzterStand)?dstr(names.LetzterStand):null,
    gehaltstag:N('Gehaltstag')||26,lohn:N('Lohn'),vl:N('VL'),
    N:Object.fromEntries(Object.entries(names).filter(([k,x])=>isNum(x))),
    budgets,spar,blocks,
    konten,depots,etf,bauspar,
    vermoegen:{ohne:n(E,colB('Vermögen (ohne Vorgemerktes)'),2),vorg:n(E,colB('Vorgemerkt'),2),gesamt:N('Vermoegen')},
    alloc:after(s1,'Topf'),
    einnahmen:after(s2,'Einnahmen'),vlRow:findRow(s2,'Vermögenswirksame Leistungen'),toepfe:after(s2,'Topf'),uebrig:findRow(s2,'Übrig (sollte 0 sein)'),
    abgleich:after(s4,'Konto · sollte enthalten'),
    gross:after(s5,'Quelle'),aufteilung:after(s5,'Aufteilung des Ersparten'),
    checks:s7.rows.map(r=>String(r[0])).filter(x=>/^[✓⚠]/.test(x)),
    vertraege:readTable(V),jahr:readTable(J)
  };
}

/* ---------------- helpers for view ---------------- */
function pace(d){
  const today=new Date();const g=d.gehaltstag||26;
  let start=new Date(today.getFullYear(),today.getMonth(),g);
  if(today<start)start=new Date(today.getFullYear(),today.getMonth()-1,g);
  const end=new Date(start.getFullYear(),start.getMonth()+1,g);
  const p=(today-start)/(end-start);
  return {p:Math.max(0,Math.min(1,p)),day:Math.floor((today-start)/864e5)+1,len:Math.round((end-start)/864e5)};
}
const pctW=r=>Math.max(0,Math.min(100,r*100)).toFixed(1)+'%';
function tr(cols,cells,cls){return `<div class="tr ${cls||''}" style="--cols:${cols}">${cells.join('')}</div>`;}
function rbtn(cols,cells,act,id,on){return `<button type="button" class="rb tr${on?' on':''}" style="--cols:${cols}" data-act="${act}" data-id="${esc(id)}" aria-expanded="${on?'true':'false'}">${cells.join('')}</button>`;}
const sp=(t,cls,st)=>`<span class="${cls||''}"${st?` style="${st}"`:''}>${t}</span>`;
function itemsList(items,colorPos){
  if(!items.length)return '<div class="faint" style="font-size:12px">Keine Buchungen in diesem Monat.</div>';
  return `<div class="cols num">${items.map((x,i)=>`<div><span class="faint">${i+1}.</span><span class="b${x>0?' pos':''}">${sg(x)}</span></div>`).join('')}</div>`;
}

/* ---------------- render ---------------- */
function render(){
  const d=st.data,main=document.getElementById('main');
  document.getElementById('reload').hidden=!handle;
  document.getElementById('forget').hidden=!d;
  if(!d){
    document.getElementById('hMonth').textContent='Noch keine Daten';
    document.getElementById('hSub').textContent='Lade deine Excel-Datei „Finanzen_Cockpit.xlsx“.';
    document.getElementById('hPills').innerHTML='';
    main.innerHTML=`<section class="empty">
      <div class="ctitle">So bekommst du deine Zahlen hier hinein</div>
      <ol>
        <li>Pflege wie gewohnt deine Excel-Datei und <b>speichere sie in Excel</b> (nur dann stehen die berechneten Werte darin).</li>
        <li>Tippe oben auf <b>„Excel-Datei laden“</b> und wähle die Datei aus – am Handy oder iPad z. B. aus iCloud Drive oder OneDrive.</li>
        <li>Das Cockpit zeigt Vermögen, Lohn-Aufteilung, Budgets, SparBudgets, Verträge, Abgleich, Erspartes und Depots. Auf diesem Gerät bleibt der letzte Stand gespeichert, bis du neu lädst.</li>
      </ol>
      <button class="btn" type="button" data-act="pick">Excel-Datei laden</button>
    </section>`;
    return;
  }
  const P=pace(d);const N=d.N;
  const [mm,yy]=d.akt.split('/');
  document.getElementById('hMonth').textContent=`${['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][+mm-1]} ${yy}`;
  document.getElementById('hSub').textContent=`Tag ${P.day} von ${P.len} seit Gehalt · Kontostand vom ${d.stand||'–'} · Lohn ${eur(d.lohn)}`;
  const kd=N.KontenDiff||0,bq=N.BudgetQuote||0;
  document.getElementById('hPills').innerHTML=
    (bq<=P.p+0.05?`<span class="pill good">● Budget im Plan</span>`:`<span class="pill warn">● Budget ${pct(bq,0)} verbraucht, Monat erst ${pct(P.p,0)}</span>`)+
    (Math.round(Math.abs(kd)*100)===0?`<span class="pill good">● Konten stimmen</span>`:`<span class="pill warn">● Konten weichen um ${sg(kd)} ab</span>`);
  main.innerHTML=[secVermoegen(d),secLohn(d),`<div class="sec">Dieser Monat <small>· Zeilen anklicken für Details</small></div>`,
    `<section class="g2">${cardBudgets(d,P)}${cardSpar(d)}${cardVertraege(d)}${cardJahr(d)}</section>`,
    secAbgleich(d),`<div class="sec">Erspartes &amp; Anlagen</div>`,secErspartes(d),`<div class="sec">Analyse</div>`,secAnalyse(d)].join('');
}

function secVermoegen(d){
  const cols=['#22D3EE','#8B5CF6','#FBBF24','#C084FC','#F472B6','#6B6390'];
  const tiles=d.alloc.rows.map((r,i)=>`<div class="tile" style="--c:${cols[i%cols.length]}"><div class="t">${esc(r[0])}</div><div class="v num">${eur(r[1])}</div><div class="n">${esc(r[2]||'')}</div></div>`).join('');
  const konten=sum(d.alloc.rows.slice(0,5).map(r=>isNum(r[1])?r[1]:0));
  return `<section class="card" style="padding:28px;gap:22px">
    <div class="chead"><div style="display:flex;flex-direction:column;gap:6px"><div class="muted" style="font-size:13px">Gesamtvermögen</div><div class="disp num" style="font-size:52px;line-height:1">${eur(d.vermoegen.gesamt)}</div></div>
    <div style="display:flex;gap:28px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:2px"><span class="csub">Auf Konten (verplant)</span><span class="big num" style="font-size:20px">${eur(konten)}</span></div>
      <div style="display:flex;flex-direction:column;gap:2px"><span class="csub">Depots &amp; Bausparen</span><span class="big num" style="font-size:20px">${eur(d.N.DepotsZV)}</span></div>
      ${d.vermoegen.vorg?`<div style="display:flex;flex-direction:column;gap:2px"><span class="csub">davon vorgemerkt</span><span class="big num wrn" style="font-size:20px">${sg(d.vermoegen.vorg)}</span></div>`:''}
    </div></div>
    <div class="tiles">${tiles}</div>
    <div class="totbar num"><span>Gesamt</span><span>${eur(d.alloc.total?d.alloc.total[1]:d.vermoegen.gesamt)}</span></div>
  </section>`;
}

function secLohn(d){
  const colors=['#8B5CF6','#22D3EE','#C084FC','#F472B6','#FBBF24','#34D399'];
  const rows=d.toepfe.rows.filter(r=>isNum(r[1]));const tot=sum(rows.map(r=>r[1]))||1;
  let acc=0;const stops=rows.map((r,i)=>{const a=acc;acc+=r[1]/tot*100;return `${colors[i%colors.length]} ${a.toFixed(2)}% ${acc.toFixed(2)}%`;});
  const einn=d.einnahmen.rows.map(r=>`<div class="tr" style="--cols:minmax(0,1fr) auto"><span class="b" style="display:flex;flex-direction:column">${esc(r[0])}${r[2]?`<small class="faint" style="font-weight:400">${esc(r[2])}</small>`:''}</span><span class="r b pos num">${sg(r[1])}</span></div>`).join('');
  const vl=d.vlRow?`<div class="tr tsub" style="--cols:minmax(0,1fr) auto"><span>${esc(d.vlRow[0])} · ${esc(d.vlRow[2]||'')}</span><span class="r num">${eur(d.vlRow[1])}</span></div>`:'';
  const tp=rows.map((r,i)=>tr('14px minmax(0,1fr) auto 64px',[`<span class="sw" style="background:${colors[i%colors.length]}"></span>`,sp(esc(r[0]),'b'),sp(eur(r[1]),'r b num'),sp(pct(r[2]),'r muted num')])).join('');
  const ub=d.uebrig?d.uebrig[1]:0;const ok=Math.round(Math.abs(ub)*100)===0;
  return `<section class="card" style="padding:28px">
    <div class="chead"><div><div class="ctitle" style="font-size:18px">Aufteilung meines Lohns</div><div class="csub">Jeder Euro hat einen Topf</div></div>
    <span class="pill ${ok?'good':'warn'}">${ok?'✓ komplett verplant':'⚠ '+sg(ub)+' nicht verplant'}</span></div>
    <div class="donutrow">
      <div class="donut" role="img" aria-label="Ringdiagramm der Lohnaufteilung" style="background:conic-gradient(${stops.join(',')})"><div><span class="csub">verfügbar</span><span class="big num">${eur(d.einnahmen.total?d.einnahmen.total[1]:tot)}</span><span class="faint" style="font-size:11px">pro Monat</span></div></div>
      <div class="tbl" style="--mw:0">${tr('minmax(0,1fr) auto',[sp('Einnahmen'),sp('Betrag','r')],'th')}${einn}${tr('minmax(0,1fr) auto',[sp('Gesamt'),sp(eur(d.einnahmen.total?d.einnahmen.total[1]:0),'r num')],'tt')}${vl}</div>
      <div class="tbl" style="--mw:0">${tr('14px minmax(0,1fr) auto 64px',[sp(''),sp('Topf'),sp('Betrag','r'),sp('Anteil','r')],'th')}${tp}
        ${tr('14px minmax(0,1fr) auto 64px',[sp(''),sp('Gesamt'),sp(eur(tot),'r num'),sp('100,0 %','r muted')],'tt')}
        ${tr('14px minmax(0,1fr) auto 64px',[sp(''),sp('Übrig','muted'),sp(eur(ub),'r b num '+(ok?'pos':'wrn')),sp('')],'tsub')}</div>
    </div></section>`;
}

function cardBudgets(d,P){
  const C='minmax(0,1.2fr) repeat(3,minmax(0,.85fr)) minmax(0,1.1fr) 16px';
  const rows=d.budgets.map(b=>{const r=b.budget?b.spent/b.budget:0;const on=st.sel.b===b.name;
    const col=r>1?'var(--bad)':(r>P.p+.2?'#FB923C':'var(--accent)');
    return rbtn(C,[sp(esc(b.name),'b',`color:${PRIO[b.prio]||''}`),sp(eur(b.budget),'r muted num'),sp(eur(b.spent),'r neg num'),sp(eur(b.rest),'r b num'+(b.rest<0?' neg':' pos')),
      `<span class="barcell"><span class="bar"><i style="width:${pctW(r)};background:${col}"></i><u style="left:${(P.p*100).toFixed(1)}%"></u></span><span class="p num"${r>P.p+.2?' style="color:var(--warn)"':''}>${pct(r)}</span></span>`,sp(on?'▾':'›','r faint')],'b',b.name,on)+(on?budgetDetail(d,b):'');}).join('');
  const t=d.N;
  return `<div class="card"><div class="chead"><div><div class="ctitle">Verfallende Budgets</div><div class="csub">Linie = ${pct(P.p,0)} des Monats vorbei</div></div>
  <div class="r"><span class="big num ${t.BudgetRest<0?'neg':'pos'}">${eur(t.BudgetRest)}</span><span class="csub"> übrig von ${eur(t.BudgetSumme)} · ${pct(t.BudgetQuote)}</span></div></div>
  <div class="scroll"><div class="tbl" style="--mw:540px">${tr(C,[sp('Budget'),sp('Betrag','r'),sp('Ausgeg.','r'),sp('Übrig','r'),sp('Verbraucht','r'),sp('')],'th')}${rows}
  ${tr(C,[sp('Gesamt'),sp(eur(t.BudgetSumme),'r num'),sp(eur(t.BudgetAusgegeben),'r neg num'),sp(eur(t.BudgetRest),'r num '+(t.BudgetRest<0?'neg':'pos')),sp(pct(t.BudgetQuote),'r','color:var(--accent-soft)'),sp('')],'tt')}</div></div></div>`;
}
function budgetDetail(d,b){
  const hs=d.blocks.map(k=>({key:k.key,p:k.pots[b.name]})).filter(x=>x.p&&(x.p.rate||x.p.items.length||x.key===d.akt));
  const done=hs.filter(x=>x.key!==d.akt);
  const avg=done.length?sum(done.map(x=>-sum(x.p.items)))/done.length:0;
  const over=done.filter(x=>-sum(x.p.items)>x.p.rate+0.004).length;
  const C='minmax(0,1fr) repeat(3,minmax(0,1fr)) 64px 16px';
  const ms=hs.map(x=>{const on=st.sel.bm===x.key;const spent=sum(x.p.items);const rest=x.p.sum;
    return rbtn(C,[sp(x.key,'b'),sp(eur(x.p.rate),'r muted num'),sp(sg(spent),'r num'),sp(sg(rest),'r b num '+(rest<-0.004?'neg':'pos')),sp(x.p.rate?pct(-spent/x.p.rate,0):'–','r b num '+(rest<-0.004?'neg':'pos')),sp(on?'▾':'›','r faint')],'bm',x.key,on)+
      (on?`<div class="sub"><div class="chead"><span class="big" style="font-size:18px">${x.p.items.length} Buchungen</span><span class="muted">Summe <b class="num" style="color:#fff">${sg(spent)}</b></span></div>${x.p.korr.length?`<div class="korr"><b>⟲ Korrektur ${sg(x.p.korrSum)}</b></div>`:''}${itemsList(x.p.items)}</div>`:'');}).join('');
  return `<div class="detail" style="margin:6px 0 10px"><div class="chead"><b style="color:#fff;font-size:15px">Verlauf: ${esc(b.name)}</b><span class="csub">Ø ${eur(avg)} pro Monat · ${over} von ${done.length} Monaten drüber</span></div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span class="faint" style="font-size:11px;letter-spacing:.06em;text-transform:uppercase">Finanzguru-Kategorien</span>${b.cats.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}<span class="chip" style="background:var(--track);color:var(--muted)">Konto: ${esc(b.konto)}</span></div>
  ${tr(C,[sp('Monat'),sp('Budget','r'),sp('Ausgeg.','r'),sp('Rest','r'),sp('%','r'),sp('')],'th')}${ms}</div>`;
}

function cardSpar(d){
  const C='minmax(0,1.3fr) repeat(3,minmax(0,.85fr)) minmax(0,1.1fr) 16px';
  const rows=d.spar.map(s=>{const r=s.ziel>0?s.stand/s.ziel:0;const on=st.sel.s===s.name;const done=s.ziel>0&&r>=1;
    return rbtn(C,[`<span style="display:flex;flex-direction:column"><span class="b" style="color:${PRIO[s.prio]||''}">${esc(s.name)}</span><span class="faint" style="font-size:11px">${s.rate?'+'+eur(s.rate)+' / Monat':'keine Rate'}${s.spent?` · <span class="neg">${eur(s.spent)} ausgeg.</span>`:''}</span></span>`,
      sp(s.ziel?eur(s.ziel):'–','r muted num'),sp(eur(s.stand),'r b num'+(s.stand<0?' neg':'')),sp(s.ziel?(s.fehlt>0?eur(s.fehlt):'✓'):'–','r muted num'),
      `<span class="barcell"><span class="bar"><i style="width:${pctW(r)};background:${done?'#34D399':'var(--accent)'}"></i></span><span class="p num"${s.stand<0?' style="color:var(--bad)"':done?' style="color:var(--good)"':''}>${s.ziel?pct(Math.max(r,0)):'–'}</span></span>`,sp(on?'▾':'›','r faint')],'s',s.name,on)+(on?sparDetail(d,s):'');}).join('');
  const t=d.N;
  const rAll=sum(d.spar.map(s=>s.rate)),rOhne=t.SparRate;
  return `<div class="card"><div class="chead"><div><div class="ctitle">SparBudgets</div><div class="csub">+${eur(rOhne)} pro Monat (ohne Urlaub) · Ziel = gewünschter Stand</div></div>
  <div class="r"><span class="big num">${eur(t.SparStand)}</span><span class="csub"> von ${eur(t.SparZiel)} · ${pct(t.SparZiel?t.SparStand/t.SparZiel:0)}</span></div></div>
  <div class="scroll"><div class="tbl" style="--mw:540px">${tr(C,[sp('SparBudget'),sp('Ziel','r'),sp('Stand','r'),sp('Fehlt','r'),sp('Erreicht','r'),sp('')],'th')}${rows}
  ${tr(C,[`<span style="display:flex;flex-direction:column">Gesamt<small class="faint" style="font-weight:500">+${eur(rAll)} / Monat</small></span>`,sp(eur(t.SparZielAlle),'r num'),sp(eur(t.SparStandAlle),'r num'),sp(eur(Math.max(0,t.SparZielAlle-t.SparStandAlle)),'r num'),sp(pct(t.SparZielAlle?t.SparStandAlle/t.SparZielAlle:0),'r','color:var(--accent-soft)'),sp('')],'tt')}
  ${tr(C,[`<span style="display:flex;flex-direction:column">davon ohne Urlaub<small class="faint">+${eur(rOhne)} / Monat</small></span>`,sp(eur(t.SparZiel),'r num'),sp(eur(t.SparStand),'r num'),sp(eur(Math.max(0,t.SparZiel-t.SparStand)),'r num'),sp(pct(t.SparZiel?t.SparStand/t.SparZiel:0),'r'),sp('')],'tsub')}</div></div></div>`;
}
function sparDetail(d,s){
  const hs=d.blocks.map(k=>({key:k.key,p:k.pots[s.name]})).filter(x=>x.p);
  const C='62px repeat(5,minmax(0,1fr)) 14px';
  const ms=hs.map(x=>{const on=st.sel.sm===x.key;const a=sum(x.p.items);
    return rbtn(C,[sp(x.key,'b'),sp(sg(x.p.rate),'r pos num'),sp(x.p.items.length?sg(a):'–','r num'),sp(x.p.korrSum?sg(x.p.korrSum):'–','r num','color:var(--korr)'),sp(sg(x.p.sum),'r b num '+(x.p.sum<-0.004?'neg':'pos')),sp(eur(x.p.stand),'r b num'+(x.p.stand<0?' neg':'')),sp(on?'▾':'›','r faint')],'sm',x.key,on)+
      (on?`<div class="sub"><div class="rate"><span>＋ Monatliche Rate</span><span class="num">${sg(x.p.rate)}</span></div>
        ${x.p.korrSum?`<div class="korr"><div class="chead"><b>⟲ Korrektur in Finanzguru</b><span>Summe <b class="num">${sg(x.p.korrSum)}</b></span></div><div style="font-size:11px;color:#8FB8D0">Manuelle Anpassung oder Umschichtung – keine Ausgabe im klassischen Sinn.</div><div class="cols num">${(x.p.korr.length?x.p.korr:[x.p.korrSum]).map((k,i)=>`<div style="border-color:#1E3E54"><span style="color:#5E90AD">⟲ ${i+1}.</span><b style="color:#BAE6FD">${sg(k)}</b></div>`).join('')}</div></div>`:''}
        <div class="chead"><span class="big" style="font-size:16px">${x.p.items.length} Buchungen</span><span class="muted">Summe <b class="num" style="color:#fff">${sg(a)}</b></span></div>${itemsList(x.p.items)}</div>`:'');}).join('');
  return `<div class="detail" style="margin:6px 0 10px"><div class="chead"><b style="color:#fff;font-size:15px">Verlauf: ${esc(s.name)}</b><span class="csub">${hs.length} Monate · Stand heute ${eur(s.stand)}</span></div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span class="faint" style="font-size:11px;letter-spacing:.06em;text-transform:uppercase">Finanzguru-Kategorien</span>${s.cats.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}<span class="chip" style="background:var(--track);color:var(--muted)">Konto: ${esc(s.konto)}</span></div>
  <div class="legend"><span><b class="pos">＋</b> Rate</span><span><b>−</b> Ausgaben</span><span><b style="color:var(--korr)">⟲</b> Korrektur in Finanzguru</span></div>
  <div class="scroll"><div class="tbl" style="--mw:480px">${tr(C,[sp('Monat'),sp('Rate','r'),sp('Ausgaben','r'),sp('Korrektur','r'),sp('Saldo','r'),sp('Stand','r'),sp('')],'th')}${ms}</div></div></div>`;
}

function cardVertraege(d){
  const C='minmax(0,1.6fr) minmax(0,.9fr) minmax(0,.8fr) minmax(0,1fr) 16px';
  const rows=d.vertraege.map(v=>{const on=st.sel.v===v['Vertrag'];const s=String(v['Status']||'');
    const tag=s.startsWith('✓')?'<span class="tag good">bezahlt</span>':s.startsWith('⚠')?'<span class="tag bad">überfällig</span>':'<span class="tag warn">offen</span>';
    return rbtn(C,[sp(esc(v['Vertrag']),'b'),sp(esc(v['Priorität']),'','font-size:12px;font-weight:600;color:'+(PRIO[v['Priorität']]||'')),sp(eur(v['Betrag']),'r num'),`<span class="r">${tag}</span>`,sp(on?'▾':'›','r faint')],'v',v['Vertrag'],on)+
      (on?`<div class="sub" style="flex-direction:row;flex-wrap:wrap;gap:16px;align-items:center;font-size:12px;color:var(--muted)"><span><span class="faint" style="font-size:10px;letter-spacing:.06em;text-transform:uppercase">Kategorie</span> <span class="chip">${esc(v['Kategorie'])}</span></span><span>Art: <b style="color:var(--fg)">${esc(v['Art'])}</b></span><span>Abbuchung: <b style="color:var(--fg)">${isNum(v['Abbuchungstag'])?v['Abbuchungstag']+'. des Monats':'–'}</b></span>${isNum(v['Rückerstattung'])&&v['Rückerstattung']>0?`<span>Andere zahlen dir <b class="pos">${eur(v['Rückerstattung'])}</b></span>`:''}</div>`:'');}).join('');
  const t=d.N;const bez=t.VertraegeSoll?t.VertraegeBezahlt/t.VertraegeSoll:0;
  return `<div class="card"><div class="chead"><div><div class="ctitle">Verträge</div><div class="csub">${eur(t.VertraegeSumme)} pro Monat · ${eur(t.WeiteresEinkommen)} kommen durch geteilte Abos zurück</div></div>
  <div class="r"><span class="big num">${eur(t.VertraegeRest)}</span><span class="csub"> offen · ${pct(bez)} bezahlt</span></div></div>
  <div class="bar" style="flex:none"><i style="width:${pctW(bez)}"></i></div>
  <div class="scroll"><div class="tbl" style="--mw:500px">${tr(C,[sp('Vertrag'),sp('Priorität'),sp('Betrag','r'),sp('Status','r'),sp('')],'th')}${rows}
  ${tr(C,[sp('Gesamt'),sp(''),sp(eur(t.VertraegeSumme),'r num'),sp(''),sp('')],'tt')}
  ${tr('minmax(0,1fr) auto',[sp('davon bezahlt'),sp(eur(t.VertraegeBezahlt),'r b pos num')],'tsub')}
  ${tr('minmax(0,1fr) auto',[sp('davon noch offen'),sp(eur(t.VertraegeRest),'r b wrn num')],'tsub')}</div></div></div>`;
}

function cardJahr(d){
  const C='86px minmax(0,1.3fr) repeat(2,minmax(0,.8fr)) minmax(0,1fr) 16px';
  const rows=d.jahr.slice().sort((a,b)=>(a['Nächste Abrechnung']||0)-(b['Nächste Abrechnung']||0)).map(j=>{const on=st.sel.j===j['Vertrag'];const r=j['Jahresbetrag']?j['Angespart']/j['Jahresbetrag']:0;
    return rbtn(C,[sp(isNum(j['Nächste Abrechnung'])?dstr(j['Nächste Abrechnung']):'–','num','font-size:12px;font-weight:600;color:var(--accent-soft)'),sp(esc(j['Vertrag']),'b'),sp(eur(j['Jahresbetrag']),'r muted num'),sp(eur(j['Angespart']),'r b num'),
      `<span class="barcell"><span class="bar"><i style="width:${pctW(r)};background:var(--lav)"></i></span><span class="p num" style="color:#D8B4FE">${pct(r)}</span></span>`,sp(on?'▾':'›','r faint')],'j',j['Vertrag'],on)+
      (on?`<div class="sub" style="flex-direction:row;flex-wrap:wrap;gap:16px;align-items:center;font-size:12px;color:var(--muted)"><span><span class="faint" style="font-size:10px;letter-spacing:.06em;text-transform:uppercase">Kategorie</span> <span class="chip">${esc(j['Kategorie'])}</span></span><span>Fällig in <b style="color:var(--fg)">${j['Monate bis fällig']} Monaten</b></span><span>Rücklage <b style="color:var(--fg)">${eur(j['Monatlich'])}</b> / Monat</span><span>Fehlt noch <b style="color:var(--fg)">${eur(j['Jahresbetrag']-j['Angespart'])}</b></span></div>`:'');}).join('');
  const t=d.N;
  return `<div class="card"><div class="chead"><div><div class="ctitle">Jahresverträge</div><div class="csub">${eur(t.JahresMonatlich)} Rücklage pro Monat · sortiert nach Fälligkeit</div></div>
  <div class="r"><span class="big num">${eur(t.JahresGespart)}</span><span class="csub"> von ${eur(t.JahresSumme)} · ${pct(t.JahresQuote)}</span></div></div>
  <div class="scroll"><div class="tbl" style="--mw:560px">${tr(C,[sp('Fällig'),sp('Vertrag'),sp('Jahr','r'),sp('Angespart','r'),sp('Fortschritt','r'),sp('')],'th')}${rows}
  ${tr(C,[sp(''),sp('Gesamt'),sp(eur(t.JahresSumme),'r num'),sp(eur(t.JahresGespart),'r num'),sp(pct(t.JahresQuote),'r','color:#D8B4FE'),sp('')],'tt')}
  ${tr(C,[sp(''),sp('Noch anzusparen'),sp(''),sp(eur(t.JahresSumme-t.JahresGespart),'r num'),sp(''),sp('')],'tsub')}</div></div></div>`;
}

function secAbgleich(d){
  const C='minmax(0,2fr) repeat(3,minmax(0,.8fr)) 130px';
  const rows=d.abgleich.rows.map(r=>{const df=isNum(r[3])?r[3]:0;const ok=String(r[4]||'').startsWith('✓');
    return tr(C,[sp(esc(r[0]),'b'),sp(eur(r[1]),'r b num'),sp(eur(r[2]),'r num'),sp(ok?'0,00 €':sg(df),'r b num '+(ok?'pos':df>0?'wrn':'neg')),`<span class="r"><span class="tag ${ok?'good':df>0?'warn':'bad'}">${esc(String(r[4]||'').replace(/^[✓⚠]\s*/,''))}</span></span>`]);}).join('');
  const t=d.abgleich.total||['Gesamt',0,0,0,''];const ok=String(t[4]||'').startsWith('✓');
  return `<section class="card ${ok?'':'warnb'}" style="padding:28px">
  <div class="chead"><div style="max-width:640px"><div class="ctitle" style="font-size:18px">Abgleich: Stimmen Konten und Planung überein?</div><div class="csub" style="font-size:13px;line-height:1.5;margin-top:6px">Jedes Konto wird mit dem Topf verglichen, der darauf liegen sollte. Plus = mehr Geld auf dem Konto als geplant, Minus = weniger.</div></div>
  <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end">
    <div><div class="csub">Auf den Konten</div><div class="big num" style="font-size:20px">${eur(t[1])}</div></div>
    <div><div class="csub">Laut Planung</div><div class="big num" style="font-size:20px">${eur(t[2])}</div></div>
    <div style="padding:10px 16px;border-radius:14px;background:${ok?'var(--good-bg)':'var(--warn-bg)'}"><div class="csub" style="color:${ok?'var(--good)':'var(--warn)'}">Differenz</div><div class="big num" style="color:${ok?'var(--good)':'var(--warn)'}">${ok?'0,00 €':sg(t[3])}</div></div>
  </div></div>
  <div class="scroll"><div class="tbl" style="--mw:720px">${tr(C,[sp('Konto · sollte enthalten'),sp('Auf dem Konto','r'),sp('Laut Planung','r'),sp('Differenz','r'),sp('Status','r')],'th')}${rows}
  ${tr(C,[sp('Gesamt'),sp(eur(t[1]),'r num'),sp(eur(t[2]),'r num'),sp(ok?'0,00 €':sg(t[3]),'r num '+(ok?'pos':'wrn')),`<span class="r"><span class="tag ${ok?'good':'warn'}">${esc(String(t[4]||'').replace(/^[✓⚠]\s*/,''))}</span></span>`],'tt')}</div></div></section>`;
}

function secErspartes(d){
  const g=d.gross.rows;const gmax=Math.max(1,...g.map(r=>Math.abs(isNum(r[1])?r[1]:0)));
  const gr=g.map(r=>{const x=isNum(r[1])?r[1]:0;return tr('minmax(0,1.2fr) minmax(0,1fr) 130px',[sp(esc(r[0])),`<span class="bar" style="flex:none"><i style="width:${pctW(Math.abs(x)/gmax)};background:${x>=0?'#34D399':'#F472B6'}"></i></span>`,sp(x===0?'0,00 €':sg(x),'r b num '+(x>0?'pos':x<0?'':'faint'),x<0?'color:#F9A8D4':'')]);}).join('');
  const gt=d.gross.total?d.gross.total[1]:0;
  const bs=d.bauspar.map(r=>tr('minmax(0,1fr) auto',[sp(esc(r[0])),sp(sg(r[1]),'r b num',r[1]<0?'color:#F9A8D4':'color:var(--good)')])).join('');
  const bst=d.N.BSPstand,bsd=d.N.BSPdiff;
  const aCols=['#F472B6','#22D3EE','#8B5CF6'];const at=d.aufteilung.rows;const atot=d.aufteilung.total?d.aufteilung.total[2]:sum(at.map(r=>r[2]||0));
  const auf=at.map((r,i)=>`<div class="tile" style="--c:${aCols[i%3]}"><div class="t">${esc(r[0])}</div><div class="v num">${eur(r[2])}</div><div class="faint" style="font-size:12px">exakt ${eur(r[1])}</div></div>`).join('');
  const DC='minmax(0,1.2fr) repeat(4,minmax(0,1fr))';
  const dep=d.depots.rows.map(r=>tr(DC,[sp(esc(r[0]),'b'),sp(eur(r[1]),'r num'),sp(eur(r[2]),'r muted num'),sp(sg(r[3]),'r b num '+(r[3]<0?'neg':'pos')),sp(isNum(r[4])?(r[4]>=0?'+':'')+pct(r[4],2):'–','r b num '+(r[4]<0?'neg':'pos'))])).join('');
  const dt=d.depots.total;
  const etf=d.etf.rows.map(r=>{const w=isNum(r[2])?r[2]:null;const g2=isNum(r[3])?r[3]:null;const e=isNum(r[1])?r[1]:0;
    return `<div class="tile" style="--c:${g2!=null&&g2<0?'#F87171':'#34D399'}"><div class="chead"><span class="b" style="font-size:15px">${esc(r[0])}</span><span class="b num ${g2<0?'neg':'pos'}">${isNum(r[4])?(r[4]>=0?'+':'')+pct(r[4],2):'–'}</span></div>
    <div class="v num">${w!=null?eur(w):'Wert fehlt'}</div>
    <div class="bar" style="flex:none;display:flex;overflow:hidden">${w?`<i style="width:${pctW(Math.min(e,w)/w)};background:#3F3566;border-radius:0"></i><i style="width:${pctW(Math.max(0,g2)/w)};background:#34D399;border-radius:0"></i>`:''}</div>
    <div class="chead csub"><span>Eingezahlt ${eur(e)}</span><span class="b num ${g2<0?'neg':'pos'}">${g2!=null?sg(g2):'–'}</span></div></div>`;}).join('');
  const et=d.etf.total;
  return `<section class="g12">
  <div class="card s7"><div><div class="ctitle">Erspartes – was kann ich wirklich ausgeben?</div><div class="csub">Vom Ersparten über Zuflüsse und Rücklagen zum freien Betrag</div></div>
    <div class="tbl" style="--mw:0">${gr}</div>
    <div class="totbar" style="background:linear-gradient(135deg,#5B21B6,#7C3AED);align-items:center"><span>Gesamt – frei für Großes</span><span class="disp num" style="font-size:28px">${eur(gt)}</span></div></div>
  <div class="card s5"><div class="chead"><div><div class="ctitle">Bausparvertrag</div><div class="csub">Aufstellung laut Eingabe</div></div><div class="r"><span class="big num">${eur(bst)}</span><span class="csub"> Kontostand</span></div></div>
    <div class="tbl" style="--mw:0">${bs}${tr('minmax(0,1fr) auto',[sp('Gesamt – Kontostand'),sp(eur(bst),'r num')],'tt')}</div>
    ${Math.round(Math.abs(bsd)*100)?`<div class="korr" style="background:var(--warn-bg);border-color:#5B3A1A;color:var(--warn)">Bausparkonto und Aufstellung weichen um ${sg(bsd)} ab.</div>`:`<div class="rate"><span>✓ Bausparkonto stimmt mit der Aufstellung</span></div>`}</div>
  <div class="card s12"><div class="chead"><div><div class="ctitle">Aufteilung des Ersparten</div><div class="csub">Notgroschen und Puffer auf Basis Lohn + VL, gerundet auf volle 1.000 €</div></div><span class="big num">${eur(atot)}</span></div>
    <div style="display:flex;height:18px;border-radius:999px;overflow:hidden;gap:3px">${at.map((r,i)=>`<div style="width:${pctW((r[2]||0)/(atot||1))};background:${aCols[i%3]}"></div>`).join('')}</div>
    <div class="tiles">${auf}</div><div class="totbar num"><span>Gesamt</span><span>${eur(atot)}</span></div></div>
  <div class="card s12"><div class="chead"><div><div class="ctitle">Depots &amp; Bausparen</div><div class="csub">Depotwert gegen selbst eingezahlt</div></div>
    ${dt?`<div style="display:flex;gap:28px;flex-wrap:wrap"><div><div class="csub">Wert</div><div class="big num">${eur(dt[1])}</div></div><div><div class="csub">Eingezahlt</div><div class="big num">${eur(dt[2])}</div></div><div><div class="csub">Gewinn</div><div class="big num ${dt[3]<0?'neg':'pos'}">${sg(dt[3])} · ${(dt[4]>=0?'+':'')+pct(dt[4],2)}</div></div></div>`:''}</div>
    <div class="scroll"><div class="tbl" style="--mw:560px">${tr(DC,[sp('Posten'),sp('Depotwert','r'),sp('Eingezahlt','r'),sp('Gewinn','r'),sp('Gewinn %','r')],'th')}${dep}
    ${dt?tr(DC,[sp('Gesamt'),sp(eur(dt[1]),'r num'),sp(eur(dt[2]),'r num'),sp(sg(dt[3]),'r num '+(dt[3]<0?'neg':'pos')),sp((dt[4]>=0?'+':'')+pct(dt[4],2),'r num '+(dt[4]<0?'neg':'pos'))],'tt'):''}</div></div>
    <div class="ctitle" style="margin-top:6px">ETFs</div>
    <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${etf}</div>
    ${et?`<div class="totbar num"><span>Gesamt</span><span style="display:flex;gap:24px;flex-wrap:wrap"><span>Wert ${eur(et[2])}</span><span class="muted">Eingezahlt ${eur(et[1])}</span><span class="${et[3]<0?'neg':'pos'}">${sg(et[3])} · ${(et[4]>=0?'+':'')+pct(et[4],2)}</span></span></div>`:''}</div>
  </section>`;
}

function secAnalyse(d){
  const ck=d.checks.map(c=>{const ok=c.startsWith('✓');const txt=c.replace(/^[✓⚠]\s*/,'');return `<div class="check"><div class="ic" style="background:${ok?'var(--good-bg)':'var(--warn-bg)'};color:${ok?'var(--good)':'var(--warn)'}">${ok?'✓':'!'}</div><div class="b" style="padding-top:4px">${esc(txt)}</div></div>`;}).join('');
  // trend: newest 12 blocks
  const bn=d.budgets.map(b=>b.name);
  const tb=d.blocks.slice(0,12).reverse().map(k=>({key:k.key,spent:-sum(bn.flatMap(n=>(k.pots[n]||{items:[]}).items)),bud:sum(bn.map(n=>(k.pots[n]||{rate:0}).rate))}));
  const done=tb.filter(x=>x.key!==d.akt);
  const avg=done.length?sum(done.map(x=>x.spent))/done.length:0,avgB=done.length?sum(done.map(x=>x.bud))/done.length:0;
  const over=done.filter(x=>x.spent>x.bud+0.004).length;
  const max=Math.max(1,...tb.map(x=>Math.max(x.spent,x.bud)))*1.08,H=180;
  const bars=tb.map(x=>`<div><span class="lbl num">${nf.format(x.spent)}</span><span class="col" style="height:${Math.round(x.spent/max*H)}px;background:${x.key===d.akt?'#3F3566':x.spent>x.bud?'#F472B6':'var(--accent)'}"></span><span class="bud" style="bottom:${Math.round(x.bud/max*H)}px"></span></div>`).join('');
  const lab=tb.map(x=>{const [m,y]=x.key.split('/');return `<div>${MONTHS[+m-1]}<br><span class="faint" style="font-size:10px">${y.slice(2)}</span></div>`;}).join('');
  // Sonstiges sparkline
  let spark='';const so=d.spar.find(s=>s.name==='Sonstiges');
  if(so){const sv=d.blocks.map(k=>k.pots.Sonstiges&&k.pots.Sonstiges.stand).filter(isNum).reverse();
    if(sv.length>1){const lo=Math.min(0,...sv),hi=Math.max(0,...sv);const W=360,HH=110;const y=v=>(HH-6-(v-lo)/((hi-lo)||1)*(HH-12)).toFixed(1);
      const pts=sv.map((v,i)=>(i*W/(sv.length-1)).toFixed(1)+','+y(v)).join(' ');const lastX=W,lastY=y(sv[sv.length-1]);
      spark=`<div class="card s12 ${so.stand<0?'badb':''}" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr);gap:24px;align-items:center">
      <div style="display:flex;flex-direction:column;gap:6px"><div class="ctitle">SparBudget Sonstiges</div><div class="disp num ${so.stand<0?'neg':'pos'}" style="font-size:30px">${eur(so.stand)}</div><div class="csub">Ziel ${eur(so.ziel)} · Verlauf über ${sv.length} Monate</div></div>
      <svg viewBox="0 0 ${W} ${HH}" preserveAspectRatio="none" style="width:100%;height:110px" role="img" aria-label="Verlauf SparBudget Sonstiges"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#4A1D1D" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/><polyline points="${pts}" fill="none" stroke="${so.stand<0?'#F87171':'#6EE7B7'}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></div>`;}}
  return `<section class="g12">
  <div class="card s5"><div class="ctitle">Checks</div>${ck||'<div class="muted">Keine Checks gefunden.</div>'}</div>
  <div class="card s7"><div class="chead"><div><div class="ctitle">Budget-Trend · letzte ${tb.length} Monate</div><div class="csub">Ausgaben der verfallenden Budgets, Strich = geplantes Budget</div></div>
    <div class="r"><div class="disp num" style="font-size:22px;color:var(--pink)">Ø ${eur(avg)}</div><div class="csub">statt Ø ${eur(avgB)} geplant</div></div></div>
    <div class="trend">${bars}</div><div class="months">${lab}</div>
    <div style="font-size:13px;padding:12px 14px;background:#2A1530;border-radius:12px;line-height:1.5">In <b style="color:#F9A8D4">${over} von ${done.length}</b> abgeschlossenen Monaten lagen die Ausgaben über dem Budget.</div></div>
  ${spark}</section>`;
}

/* ---------------- loading ---------------- */
let handle=null;
function setMsg(t){document.getElementById('msg').innerHTML=t?`<div class="err">${esc(t)}</div>`:'';}
function info(){const d=st.data;document.getElementById('loadInfo').textContent=d?`Geladen: ${d.file||'Excel-Datei'} · ${new Date(d.loaded).toLocaleString('de-DE')}`:'Oder die Datei hierher ziehen. Die Datei wird nur in deinem Browser gelesen und nirgends hochgeladen.';}
async function readFile(file){
  setMsg('');
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellFormula:true});
    const data=parse(wb);data.file=file.name;
    st.data=data;st.sel={b:null,bm:null,s:null,sm:null,v:null,j:null};
    try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
    info();render();
  }catch(e){console.error(e);setMsg(e.message||'Die Datei konnte nicht gelesen werden.');}
}
const fileIn=document.getElementById('file');
fileIn.addEventListener('change',e=>{const f=e.target.files[0];if(f)readFile(f);fileIn.value='';});
async function pick(){
  if(window.showOpenFilePicker&&window.self===window.top){
    try{const [h]=await window.showOpenFilePicker({types:[{description:'Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});handle=h;saveHandle(h);await readFile(await h.getFile());return;}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  fileIn.click();
}
async function reload(){if(!handle)return pick();try{if((await handle.queryPermission({mode:'read'}))!=='granted'&&(await handle.requestPermission({mode:'read'}))!=='granted')return;await readFile(await handle.getFile());}catch(e){setMsg('Die Datei konnte nicht erneut gelesen werden. Bitte über „Excel-Datei laden“ neu auswählen.');}}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('finanzcockpit',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function saveHandle(h){try{const db=await idb();db.transaction('h','readwrite').objectStore('h').put(h,'file');}catch(e){}}
async function loadHandle(){try{if(!(window.showOpenFilePicker&&window.self===window.top))return;const db=await idb();const rq=db.transaction('h').objectStore('h').get('file');rq.onsuccess=()=>{handle=rq.result||null;render();};}catch(e){}}
document.getElementById('pick').addEventListener('click',pick);
document.getElementById('reload').addEventListener('click',reload);
document.getElementById('forget').addEventListener('click',()=>{try{localStorage.removeItem(KEY);}catch(e){}st.data=null;info();render();});
const lb=document.getElementById('loadbar');
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();lb.classList.add('drag');}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();if(t==='drop'||e.target===document.documentElement)lb.classList.remove('drag');}));
document.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)readFile(f);});
document.getElementById('main').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;const s=st.sel;
  if(a==='pick')return pick();
  if(a==='b'){s.b=s.b===id?null:id;s.bm=null;}
  else if(a==='bm'){s.bm=s.bm===id?null:id;}
  else if(a==='s'){s.s=s.s===id?null:id;s.sm=null;}
  else if(a==='sm'){s.sm=s.sm===id?null:id;}
  else if(a==='v'){s.v=s.v===id?null:id;}
  else if(a==='j'){s.j=s.j===id?null:id;}
  render();
});
try{const raw=localStorage.getItem(KEY);if(raw)st.data=JSON.parse(raw);}catch(e){}
info();render();loadHandle();
window.__fcParse=parse;window.__fcRender=(data,sel)=>{st.data=data;if(sel)st.sel=sel;render();return document.getElementById('main').innerHTML;};
})();
</script>
